<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Layering: teacup model and mammography</title>
  <desc id="desc">Schematic explanation of round calcifications on CC and crescentic sedimentation on MLO.</desc>
  <rect width="1280" height="720" rx="28" fill="#071d3a"/>
  <text x="54" y="64" fill="#e73368" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">LAYERING</text>
  <text x="54" y="102" fill="#fff" font-family="Georgia,serif" font-size="31" font-weight="700">Teacup model → Mammography</text>
  <line x1="640" y1="136" x2="640" y2="665" stroke="#334d6e" stroke-width="2"/>

  <text x="320" y="160" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Model: teacup</text>
  <text x="160" y="205" text-anchor="middle" fill="#a7bdd3" font-family="Arial,sans-serif" font-size="18">Top view</text>
  <text x="480" y="205" text-anchor="middle" fill="#a7bdd3" font-family="Arial,sans-serif" font-size="18">Side view</text>
  <circle cx="160" cy="350" r="108" fill="#c7d6e4" fill-opacity=".12" stroke="#b6ccdf" stroke-width="5"/>
  <circle cx="160" cy="350" r="86" fill="#d99835" fill-opacity=".65" stroke="#f6c06b" stroke-width="3"/>
  <text x="160" y="505" text-anchor="middle" fill="#dbe7f1" font-family="Arial,sans-serif" font-size="18">Round / smudgy</text>
  <path d="M374 287 Q480 245 586 287 L566 505 Q480 550 394 505 Z" fill="#c7d6e4" fill-opacity=".12" stroke="#b6ccdf" stroke-width="5"/>
  <path d="M394 430 Q480 480 566 430 L566 505 Q480 550 394 505 Z" fill="#d99835" fill-opacity=".65"/>
  <path d="M394 430 Q480 480 566 430" fill="none" stroke="#fff0b0" stroke-width="12"/>
  <g fill="#5a3b24"><path d="M438 495 q14-20 28 0 q-14 16-28 0"/><path d="M470 506 q15-22 30 0 q-15 17-30 0"/><path d="M507 492 q13-18 27 0 q-13 15-27 0"/><path d="M456 516 q11-14 23 0 q-11 12-23 0"/></g>
  <path d="M374 287 Q480 245 586 287" fill="none" stroke="#f6c06b" stroke-width="3"/>
  <text x="480" y="590" text-anchor="middle" fill="#dbe7f1" font-family="Arial,sans-serif" font-size="18">Tea leaves settle at the bottom</text>
  <text x="480" y="620" text-anchor="middle" fill="#ffb347" font-family="Arial,sans-serif" font-size="18" font-weight="700">Crescent-shaped layer</text>

  <text x="960" y="160" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Mammographic appearance</text>
  <rect x="700" y="205" width="520" height="190" rx="14" fill="#0e2b4c" stroke="#5a7695" stroke-width="2"/>
  <text x="730" y="242" fill="#a7d9f2" font-family="Arial,sans-serif" font-size="19" font-weight="700">A · CC view (top view)</text>
  <ellipse cx="960" cy="315" rx="135" ry="52" fill="#c7d6e4" fill-opacity=".12" stroke="#b6ccdf" stroke-width="3"/>
  <g fill="#ffb347"><circle cx="850" cy="300" r="6"/><circle cx="890" cy="278" r="6"/><circle cx="940" cy="270" r="6"/><circle cx="992" cy="279" r="6"/><circle cx="1040" cy="304" r="6"/><circle cx="1060" cy="331" r="6"/><circle cx="1010" cy="350" r="6"/><circle cx="960" cy="358" r="6"/><circle cx="900" cy="348" r="6"/></g>
  <text x="730" y="370" fill="#dbe7f1" font-family="Arial,sans-serif" font-size="17">round, amorphous or smudgy</text>
  <rect x="700" y="435" width="520" height="190" rx="14" fill="#0e2b4c" stroke="#5a7695" stroke-width="2"/>
  <text x="730" y="472" fill="#a7d9f2" font-family="Arial,sans-serif" font-size="19" font-weight="700">B · MLO view (side view)</text>
  <ellipse cx="960" cy="540" rx="135" ry="55" fill="#c7d6e4" fill-opacity=".12" stroke="#b6ccdf" stroke-width="3"/>
  <path d="M835 566 Q960 620 1085 566" fill="none" stroke="#ffb347" stroke-width="14"/>
  <path d="M860 552 Q960 594 1060 552" fill="none" stroke="#fff0b0" stroke-width="4" stroke-dasharray="8 9"/>
  <text x="730" y="602" fill="#dbe7f1" font-family="Arial,sans-serif" font-size="17">at the cyst floor: meniscus / teacup sign</text>
</svg>
