<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">MRI-Artefaktmuster 1 bis 6</title>
  <desc id="desc">Sechs nummerierte, schematische Muster ohne Patientendaten; die lokalisierte Legende ordnet sie den Artefakten zu.</desc>
  <rect width="900" height="420" rx="22" fill="#f4fafb"/>
  <g fill="#fff" stroke="#a8cbd1" stroke-width="2">
    <rect x="20" y="20" width="275" height="175" rx="16"/><rect x="312" y="20" width="275" height="175" rx="16"/><rect x="605" y="20" width="275" height="175" rx="16"/>
    <rect x="20" y="215" width="275" height="185" rx="16"/><rect x="312" y="215" width="275" height="185" rx="16"/><rect x="605" y="215" width="275" height="185" rx="16"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183b45">
    <circle cx="48" cy="48" r="18" fill="#d9eef1"/><text x="42" y="56">1</text>
    <circle cx="340" cy="48" r="18" fill="#d9eef1"/><text x="334" y="56">2</text>
    <circle cx="633" cy="48" r="18" fill="#d9eef1"/><text x="627" y="56">3</text>
    <circle cx="48" cy="243" r="18" fill="#d9eef1"/><text x="42" y="251">4</text>
    <circle cx="340" cy="243" r="18" fill="#d9eef1"/><text x="334" y="251">5</text>
    <circle cx="633" cy="243" r="18" fill="#d9eef1"/><text x="627" y="251">6</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1: signal loss and geometric warping around an interface -->
    <path d="M88 83H245M88 105H145M185 105H245M88 127H145M185 127H245M88 149H245" stroke="#32899a" stroke-width="5"/>
    <ellipse cx="165" cy="116" rx="19" ry="43" fill="#263a40" stroke="none"/>
    <path d="M151 81Q139 94 146 106M179 127Q188 141 179 151" stroke="#d19636" stroke-width="4"/>
    <!-- 2: displaced repeated copies -->
    <rect x="360" y="78" width="52" height="70" rx="24" stroke="#32899a" stroke-width="5"/>
    <rect x="416" y="78" width="52" height="70" rx="24" stroke="#32899a" stroke-width="4" opacity=".56"/>
    <rect x="472" y="78" width="52" height="70" rx="24" stroke="#32899a" stroke-width="3" opacity=".28"/>
    <path d="M362 160H530" stroke="#d19636" stroke-width="3" stroke-dasharray="7 7"/>
    <!-- 3: outside-FOV structures folded at opposite edges -->
    <rect x="655" y="78" width="178" height="73" rx="8" stroke="#718b91" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M680 95Q695 78 710 95V135Q695 151 680 135ZM770 95Q785 78 800 95V135Q785 151 770 135Z" stroke="#32899a" stroke-width="5"/>
    <path d="M710 115H770" stroke="#d19636" stroke-width="3" stroke-dasharray="6 6"/>
    <!-- 4: narrow continuous interference line -->
    <path d="M75 305H248" stroke="#32899a" stroke-width="3"/>
    <path d="M75 326H248" stroke="#32899a" stroke-width="3" opacity=".5"/>
    <path d="M164 274V367" stroke="#c45155" stroke-width="6"/>
    <!-- 5: ringing parallel to a sharp edge -->
    <path d="M360 310H420L428 290L436 330L444 299L452 323L460 305L468 315H535" stroke="#32899a" stroke-width="4"/>
    <path d="M360 346H535" stroke="#a8cbd1" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- 6: paired, shifted fat-water contours -->
    <path d="M655 290Q695 270 735 290V355Q695 375 655 355Z" stroke="#32899a" stroke-width="5"/>
    <path d="M705 290Q745 270 785 290V355Q745 375 705 355Z" stroke="#d19636" stroke-width="5"/>
  </g>
</svg>
