<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">Inversion-Recovery: Nullpunkte von Fett und Liquor</title><desc id="desc">Schematische Erholung der longitudinalen Magnetisierung nach 180 Grad. Kurzes TI nullt Fett, langes TI Liquor. Nicht maßstabsgetreu.</desc>
