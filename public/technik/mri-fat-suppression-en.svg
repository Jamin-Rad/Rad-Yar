<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Water-fat phase and Dixon reconstruction</title><desc id="desc">Concept: water and fat vectors add in phase; opposed phase vectors point in opposite directions and can partly cancel. Dixon reconstructs separate water-signal and fat-signal images.</desc><rect width="1200" height="520" rx="28" fill="#f7fbfc"/><g font-family="Arial,sans-serif" fill="#173b48"><text x="48" y="55" font-size="28" font-weight="700">Water-fat signal relationship</text><g transform="translate(45,90)"><rect width="350" height="350" rx="20" fill="#fff" stroke="#9bbfc8" stroke-width="3"/><text x="25" y="45" font-size="24" font-weight="700">In phase</text><text x="25" y="78" font-size="17">Signals point in the same direction</text><line x1="70" y1="195" x2="260" y2="195" stroke="#dbe7ea" stroke-width="4"/><line x1="70" y1="195" x2="175" y2="195" stroke="#167eaa" stroke-width="10"/><polygon points="175,195 154,182 154,208" fill="#167eaa"/><line x1="70" y1="235" x2="175" y2="235" stroke="#c58a16" stroke-width="10"/><polygon points="175,235 154,222 154,248" fill="#c58a16"/><text x="185" y="202" font-size="18">Water</text><text x="185" y="242" font-size="18">Fat</text><line x1="70" y1="305" x2="280" y2="305" stroke="#315c69" stroke-width="9"/><polygon points="280,305 258,291 258,319" fill="#315c69"/><text x="24" y="338" font-size="17">Larger sum</text></g><g transform="translate(425,90)"><rect width="350" height="350" rx="20" fill="#fff" stroke="#9bbfc8" stroke-width="3"/><text x="25" y="45" font-size="24" font-weight="700">Opposed phase</text><text x="25" y="78" font-size="17">Signals point in opposite directions</text><line x1="70" y1="195" x2="260" y2="195" stroke="#dbe7ea" stroke-width="4"/><line x1="70" y1="195" x2="205" y2="195" stroke="#167eaa" stroke-width="10"/><polygon points="205,195 184,182 184,208" fill="#167eaa"/><line x1="205" y1="235" x2="120" y2="235" stroke="#c58a16" stroke-width="10"/><polygon points="120,235 141,222 141,248" fill="#c58a16"/><text x="215" y="202" font-size="18">Water</text><text x="215" y="242" font-size="18">Fat</text><line x1="70" y1="305" x2="155" y2="305" stroke="#315c69" stroke-width="9"/><polygon points="155,305 133,291 133,319" fill="#315c69"/><text x="24" y="338" font-size="17">Partial cancellation</text></g><g transform="translate(805,90)"><rect width="350" height="350" rx="20" fill="#fff" stroke="#9bbfc8" stroke-width="3"/><text x="25" y="45" font-size="24" font-weight="700">Dixon outputs</text><text x="25" y="78" font-size="17">Separated reconstructions</text><rect x="35" y="115" width="280" height="82" rx="14" fill="#e5f3f8" stroke="#167eaa" stroke-width="3"/><text x="175" y="150" font-size="23" text-anchor="middle" font-weight="700">Water-only</text><text x="175" y="178" font-size="16" text-anchor="middle">Water signal</text><rect x="35" y="215" width="280" height="82" rx="14" fill="#fff3d6" stroke="#c58a16" stroke-width="3"/><text x="175" y="250" font-size="23" text-anchor="middle" font-weight="700">Fat-only</text><text x="175" y="278" font-size="16" text-anchor="middle">Fat signal</text><text x="25" y="330" font-size="16">Conceptual; not measurements</text></g></g></svg>
