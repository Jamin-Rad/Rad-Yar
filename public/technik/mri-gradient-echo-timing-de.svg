<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Gradientenecho: Zeitdiagramm</title>
  <desc id="desc">Schematische HF-Anregung mit kleinem Flipwinkel, dephasierender Gradient, umgekehrter Rephasing-Gradient und ausgelesenes Echo bei TE. Kein 180-Grad-HF-Puls.</desc>
  <rect width="1000" height="360" rx="24" fill="#f5f9fb"/>
  <text x="46" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17627c">GRADIENTEN-ECHO · ZEITABLAUF (SCHEMATISCH)</text>
  <line x1="145" y1="120" x2="930" y2="120" stroke="#526575" stroke-width="3"/>
  <line x1="185" y1="86" x2="185" y2="154" stroke="#1484a0" stroke-width="12"/>
  <text x="135" y="80" font-family="Arial,sans-serif" font-size="19" fill="#17627c">kleiner HF-Flipwinkel</text>
  <text x="185" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#34495e">Anregung</text>
  <line x1="145" y1="235" x2="930" y2="235" stroke="#526575" stroke-width="2"/>
  <path d="M185 235 L260 235 L300 285 L390 285 L440 235 L485 235 L545 185 L690 185 L745 235 L930 235" fill="none" stroke="#3f67b1" stroke-width="7" stroke-linejoin="round"/>
  <text x="345" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#34495e">Gradient: dephasieren</text>
  <text x="620" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#34495e">Gradient umkehren: rephasieren</text>
  <line x1="745" y1="100" x2="745" y2="304" stroke="#8493a1" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M685 120 C710 120 716 83 745 83 C774 83 780 120 805 120" fill="none" stroke="#c15288" stroke-width="5"/>
  <text x="745" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#9d356b">Echo bei TE</text>
  <line x1="185" y1="338" x2="745" y2="338" stroke="#687987" stroke-width="2"/>
  <path d="M185 338 l14 -8 v16 z M745 338 l-14 -8 v16 z" fill="#687987"/>
  <text x="465" y="331" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#34495e">TE</text>
</svg>
