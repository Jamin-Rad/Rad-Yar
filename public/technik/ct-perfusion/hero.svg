    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#bcebf0"/></marker>
  </defs>
  <rect width="960" height="620" rx="36" fill="url(#bg)"/>
