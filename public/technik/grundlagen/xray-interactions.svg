<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Two X-ray interaction pathways</title>
  <desc id="desc">On the left, a photon is fully absorbed and ejects an electron. On the right, a photon ejects an electron and continues in a new direction with lower energy.</desc>
  <defs><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1687b2"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc8735"/></marker></defs>
  <rect x="14" y="14" width="424" height="322" rx="22" fill="#f8fbfd" stroke="#c6d7e0" stroke-width="2"/>
  <rect x="462" y="14" width="424" height="322" rx="22" fill="#f8fbfd" stroke="#c6d7e0" stroke-width="2"/>
  <g fill="#dce8ef" stroke="#536e7d" stroke-width="2"><circle cx="230" cy="174" r="34"/><circle cx="676" cy="174" r="34"/></g>
  <circle cx="230" cy="174" r="8" fill="#5b7280"/><circle cx="676" cy="174" r="8" fill="#5b7280"/>
  <path d="M60 174H184" stroke="#1687b2" stroke-width="6" marker-end="url(#blueArrow)"/>
  <path d="M506 174H630" stroke="#1687b2" stroke-width="6" marker-end="url(#blueArrow)"/>
  <path d="M700 150L814 76" stroke="#1687b2" stroke-width="5" marker-end="url(#blueArrow)"/>
  <path d="M244 148L333 69" stroke="#dc8735" stroke-width="5" marker-end="url(#orangeArrow)"/>
  <path d="M690 204L764 270" stroke="#dc8735" stroke-width="5" marker-end="url(#orangeArrow)"/>
  <text x="70" y="142" font-family="Arial,sans-serif" font-size="18" fill="#214256">hν</text><text x="516" y="142" font-family="Arial,sans-serif" font-size="18" fill="#214256">hν</text>
  <text x="347" y="65" font-family="Arial,sans-serif" font-size="18" fill="#8d511d">e⁻</text><text x="774" y="284" font-family="Arial,sans-serif" font-size="18" fill="#8d511d">e⁻</text>
  <text x="213" y="235" font-family="Arial,sans-serif" font-size="14" fill="#526b78">absorbed</text>
  <text x="660" y="235" font-family="Arial,sans-serif" font-size="14" fill="#526b78">scattered</text>
</svg>
