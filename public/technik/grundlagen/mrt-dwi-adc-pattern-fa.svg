<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">مقایسهٔ الگوهای DWI و ADC</title><desc id="desc">DWI روشن با ADC پایین از محدودیت انتشار حمایت می‌کند. DWI روشن با ADC طبیعی یا بالا با عبور سیگنال T2 سازگار است.</desc>
<rect width="900" height="300" rx="20" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#16324a">
<text x="30" y="48" font-size="24" font-weight="700">DWI و ADC را با هم بخوانید</text>
<rect x="28" y="72" width="410" height="196" rx="14" fill="#e7f4f3" stroke="#73b8b2" stroke-width="2"/><rect x="462" y="72" width="410" height="196" rx="14" fill="#f2edf8" stroke="#aa91c8" stroke-width="2"/>
<text x="50" y="108" font-size="19" font-weight="700">الگوی محدودیت انتشار</text><text x="484" y="108" font-size="19" font-weight="700">الگوی عبور سیگنال T2</text>
<text x="54" y="158" font-size="22">DWI</text><rect x="135" y="132" width="92" height="38" rx="8" fill="#fff" stroke="#b8c7d2"/><text x="153" y="158" font-size="18" font-weight="700">روشن</text>
<text x="54" y="218" font-size="22">ADC</text><rect x="135" y="192" width="92" height="38" rx="8" fill="#d5e6eb" stroke="#9bb8c3"/><text x="155" y="218" font-size="18" font-weight="700">پایین</text><text x="247" y="184" font-size="17">حمایت از محدودیت</text>
<text x="488" y="158" font-size="22">DWI</text><rect x="569" y="132" width="92" height="38" rx="8" fill="#fff" stroke="#b8c7d2"/><text x="587" y="158" font-size="18" font-weight="700">روشن</text>
<text x="488" y="218" font-size="22">ADC</text><rect x="569" y="192" width="132" height="38" rx="8" fill="#fff" stroke="#b8c7d2"/><text x="582" y="218" font-size="16" font-weight="700">طبیعی / بالا</text><text x="719" y="184" font-size="17">عبور سیگنال T2</text>
</g></svg>



