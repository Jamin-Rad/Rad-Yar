<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">X-ray tube principle</title>
  <desc id="desc">Electrons travel from the cathode filament through a vacuum to an angled anode target. X-rays emerge from the focal spot.</desc>
  <defs>
    <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#e8f6ff" stop-opacity=".35"/><stop offset=".5" stop-color="#d4e7f5" stop-opacity=".14"/><stop offset="1" stop-color="#e8f6ff" stop-opacity=".35"/></linearGradient>
    <linearGradient id="anode" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2b24b"/><stop offset="1" stop-color="#a95618"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#41a5d8"/></marker>
  </defs>
  <rect x="18" y="28" width="864" height="304" rx="34" fill="#f7fbff" stroke="#b5cedd" stroke-width="3"/>
  <path d="M82 90H630Q678 90 704 132V226Q678 270 630 270H82Q50 270 50 238V122Q50 90 82 90Z" fill="url(#glass)" stroke="#7c9cad" stroke-width="3"/>
  <path d="M102 178h25l12-22 12 44 12-44 12 44 12-22h30" fill="none" stroke="#d44e5d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M245 145Q274 178 245 211" fill="none" stroke="#536d7a" stroke-width="9" stroke-linecap="round"/>
  <path d="M300 177H590" stroke="#41a5d8" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <path d="M625 113L679 130L646 239L592 222Z" fill="url(#anode)" stroke="#874417" stroke-width="3"/>
  <circle cx="620" cy="180" r="6" fill="#fff0a7" stroke="#bc641b" stroke-width="3"/>
  <g stroke="#f2a52d" stroke-width="4" opacity=".9"><path d="M620 180L765 94"/><path d="M620 180L802 145"/><path d="M620 180L820 180"/><path d="M620 180L802 215"/><path d="M620 180L765 266"/></g>
  <text x="102" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17354a">−</text>
  <text x="659" y="116" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17354a">+</text>
  <text x="136" y="310" font-family="Arial,sans-serif" font-size="16" fill="#486271">FILAMENT</text>
  <text x="280" y="310" font-family="Arial,sans-serif" font-size="16" fill="#486271">e⁻</text>
  <text x="595" y="310" font-family="Arial,sans-serif" font-size="16" fill="#486271">FOCAL SPOT</text>
  <text x="766" y="310" font-family="Arial,sans-serif" font-size="16" fill="#486271">X-RAY BEAM</text>
</svg>
