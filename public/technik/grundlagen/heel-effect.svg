<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Anode heel effect</title>
  <desc id="desc">Relative X-ray beam intensity is higher at the cathode side and decreases toward the anode side due to absorption within the anode.</desc>
  <defs>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#f6c96f" stop-opacity=".45"/><stop offset="1" stop-color="#f6c96f" stop-opacity=".08"/></linearGradient>
  </defs>
  <rect x="18" y="20" width="864" height="300" rx="24" fill="#fbfdff" stroke="#c9d8e1" stroke-width="2"/>
  <path d="M118 76H782V260H118Z" fill="url(#beam)"/>
  <path d="M118 250H782" stroke="#78909c" stroke-width="2"/>
  <path d="M118 250V70" stroke="#78909c" stroke-width="2"/>
  <path d="M145 112 C250 116 315 138 380 166 S500 207 560 219 S680 232 758 237" fill="none" stroke="#167fa9" stroke-width="7" stroke-linecap="round"/>
  <path d="M146 112V250M758 237V250" stroke="#167fa9" stroke-width="2" stroke-dasharray="5 6"/>
  <circle cx="145" cy="112" r="8" fill="#167fa9"/><circle cx="758" cy="237" r="8" fill="#167fa9"/>
  <text x="118" y="287" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#214256">CATHODE SIDE</text>
  <text x="650" y="287" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#214256">ANODE SIDE</text>
  <text x="132" y="55" font-family="Arial,sans-serif" font-size="16" fill="#536d7a">RELATIVE INTENSITY</text>
  <text x="391" y="292" font-family="Arial,sans-serif" font-size="15" fill="#667c87">ACROSS X-RAY FIELD →</text>
</svg>
