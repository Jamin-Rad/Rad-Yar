<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Digital radiography detector conversion chains</title>
  <desc id="desc">Computed radiography stores energy on a plate and requires a separate laser reader. Indirect digital radiography converts X-rays to light and then charge. Direct digital radiography converts X-rays to charge.</desc>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#387b9a"/></marker></defs>
  <rect x="12" y="14" width="936" height="332" rx="20" fill="#fbfdff" stroke="#c8d9e2" stroke-width="2"/>
  <g font-family="Arial,sans-serif" font-size="17" fill="#28495d" text-anchor="middle">
    <text x="165" y="62" font-weight="700">CR</text><text x="480" y="62" font-weight="700">DR INDIRECT</text><text x="795" y="62" font-weight="700">DR DIRECT</text>
    <text x="95" y="167">X-ray</text><text x="220" y="167">storage plate</text><text x="324" y="167">laser reader</text>
    <text x="410" y="167">X-ray</text><text x="520" y="167">light</text><text x="635" y="167">charge</text>
    <text x="720" y="167">X-ray</text><text x="850" y="167">charge</text>
    <text x="165" y="255" fill="#607987" font-size="14">store → read → erase</text><text x="525" y="255" fill="#607987" font-size="14">scintillator → photodiode</text><text x="785" y="255" fill="#607987" font-size="14">photoconductor</text>
  </g>
  <g stroke="#387b9a" stroke-width="3" marker-end="url(#arr)"><path d="M131 178H177"/><path d="M262 178H278"/><path d="M445 178H468"/><path d="M562 178H585"/><path d="M755 178H811"/></g>
  <g fill="#e9f2f7" stroke="#aac2ce" stroke-width="2"><rect x="179" y="112" width="82" height="88" rx="12"/><rect x="280" y="112" width="90" height="88" rx="12"/><rect x="469" y="112" width="92" height="88" rx="12"/><rect x="586" y="112" width="92" height="88" rx="12"/><rect x="812" y="112" width="92" height="88" rx="12"/></g>
</svg>
