<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">X-ray attenuation by iodine</title>
  <desc id="desc">A conceptual comparison of X-ray beams passing through soft tissue and an iodine-containing vessel. The iodine path attenuates more of the beam before it reaches the detector.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="560" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FDFA"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="beam" x1="36" y1="0" x2="482" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity=".82"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="attenuated" x1="36" y1="0" x2="482" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity=".82"/>
      <stop offset=".47" stop-color="#06B6D4" stop-opacity=".62"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="536" height="416" rx="34" fill="url(#panel)" stroke="#99F6E4" stroke-width="3"/>
  <rect x="38" y="46" width="484" height="152" rx="24" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="38" y="242" width="484" height="152" rx="24" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
  <g stroke="url(#beam)" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 13">
    <path d="M70 88H460"/><path d="M70 122H460"/><path d="M70 156H460"/>
  </g>
  <rect x="209" y="64" width="95" height="116" rx="30" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
  <rect x="461" y="65" width="24" height="114" rx="8" fill="#0F766E"/>
  <rect x="468" y="79" width="10" height="15" rx="5" fill="#99F6E4"/>
  <rect x="468" y="105" width="10" height="15" rx="5" fill="#99F6E4"/>
  <rect x="468" y="131" width="10" height="15" rx="5" fill="#99F6E4"/>
  <rect x="468" y="157" width="10" height="10" rx="5" fill="#99F6E4"/>
  <g stroke="url(#attenuated)" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 13">
    <path d="M70 284H460"/><path d="M70 318H460"/><path d="M70 352H460"/>
  </g>
  <rect x="209" y="260" width="95" height="116" rx="30" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
  <path d="M256 263v110" stroke="#F59E0B" stroke-width="24" stroke-linecap="round"/>
  <g fill="#FEF3C7" stroke="#D97706" stroke-width="3">
    <circle cx="256" cy="281" r="8"/><circle cx="256" cy="301" r="8"/><circle cx="256" cy="321" r="8"/><circle cx="256" cy="341" r="8"/><circle cx="256" cy="361" r="8"/>
  </g>
  <rect x="461" y="261" width="24" height="114" rx="8" fill="#0F766E"/>
