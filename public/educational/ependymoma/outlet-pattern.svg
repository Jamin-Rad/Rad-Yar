<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="title desc">
  <title id="title">Fourth ventricle and outlet extension concept diagram</title>
  <desc id="desc">A non-patient-specific schematic. A mass is centred at the floor of the fourth ventricle, with arrows toward the lateral foramina of Luschka and the median foramen of Magendie.</desc>
  <rect width="920" height="410" rx="24" fill="#f5fafb"/>
  <rect x="18" y="18" width="432" height="374" rx="18" fill="#fff" stroke="#cbdde2" stroke-width="2"/>
  <rect x="470" y="18" width="432" height="374" rx="18" fill="#fff" stroke="#cbdde2" stroke-width="2"/>
  <!-- sagittal midline: brainstem anterior (left), cerebellum posterior (right) -->
  <path d="M92 90 Q145 55 202 83 Q222 110 213 154 L215 273 Q205 323 158 341 Q116 331 103 292 L105 212 Q89 160 92 90Z" fill="#e6a08d" stroke="#a75c50" stroke-width="4"/>
  <path d="M236 91 Q315 42 386 105 Q411 145 389 195 Q427 234 393 291 Q370 338 308 343 Q274 315 272 275 Q245 236 260 201 Q228 157 236 91Z" fill="#b7dbe1" stroke="#518492" stroke-width="4"/>
  <path d="M214 142 Q244 155 271 142 L290 206 Q266 239 232 224Z" fill="#d9f2f5" stroke="#398b9b" stroke-width="4"/>
  <path d="M230 205 Q245 190 268 204 Q275 220 261 238 L246 267 Q231 265 225 249Z" fill="#eb9666" stroke="#9f5736" stroke-width="4"/>
  <path d="M246 254 Q252 275 271 287" fill="none" stroke="#c86f42" stroke-width="9" stroke-linecap="round"/>
  <path d="M258 285 L258 316" stroke="#c86f42" stroke-width="6" marker-end="url(#arrow)"/>
  <circle cx="226" cy="202" r="18" fill="#155d70"/><text x="226" y="209" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">1</text>
  <circle cx="281" cy="306" r="18" fill="#155d70"/><text x="281" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">3</text>
  <!-- axial orientation inset: lateral outlets -->
  <path d="M526 194 Q544 87 680 83 Q816 87 834 194 Q816 290 680 300 Q544 290 526 194Z" fill="#b7dbe1" stroke="#518492" stroke-width="4"/>
  <path d="M630 128 Q680 102 730 128 L715 177 Q680 194 645 177Z" fill="#e6a08d" stroke="#a75c50" stroke-width="4"/>
  <path d="M650 191 Q680 178 710 191 L699 238 Q680 252 661 238Z" fill="#d9f2f5" stroke="#398b9b" stroke-width="4"/>
  <path d="M651 220 Q638 239 614 234 Q599 227 607 213 L634 202Z" fill="#eb9666" stroke="#9f5736" stroke-width="4"/>
  <path d="M709 220 Q722 239 746 234 Q761 227 753 213 L726 202Z" fill="#eb9666" stroke="#9f5736" stroke-width="4"/>
  <path d="M622 226 L570 257" stroke="#c86f42" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M738 226 L790 257" stroke="#c86f42" stroke-width="6" marker-end="url(#arrow)"/>
  <circle cx="796" cy="280" r="18" fill="#155d70"/><text x="796" y="287" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">2</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#c86f42"/></marker></defs>
</svg>
