  <title id="title">Pulmonary artery occlusion and peripheral infarct pattern</title>
  <desc id="desc">A schematic pulmonary artery branches toward the lung periphery. A clot blocks one branch, with a wedge-shaped peripheral opacity whose base touches the pleura.</desc>
