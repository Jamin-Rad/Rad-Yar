<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" role="img" aria-labelledby="title desc">
  <title id="title">Sequence comparison concept schematic</title>
  <desc id="desc">Non-diagnostic conceptual pattern chart: conventional T1/T2 may overlap, while FLAIR and diffusion signal can separate epidermoid-like from arachnoid-like fluid lesions.</desc>
  <rect width="840" height="410" rx="24" fill="#f1f7f7"/>
  <rect x="126" y="36" width="306" height="338" rx="18" fill="#fff" stroke="#b7d1d5" stroke-width="3"/>
  <rect x="450" y="36" width="264" height="338" rx="18" fill="#fff" stroke="#b7d1d5" stroke-width="3"/>
  <g fill="#d6e7eb" stroke="#557f8b" stroke-width="5">
    <ellipse cx="280" cy="108" rx="78" ry="32"/><ellipse cx="582" cy="108" rx="68" ry="32"/>
  </g>
  <g fill="#a5d6d8" stroke="#197381" stroke-width="5">
    <ellipse cx="280" cy="206" rx="78" ry="32"/>
  </g>
  <g fill="#263c50" stroke="#263c50" stroke-width="5">
    <ellipse cx="582" cy="206" rx="68" ry="32"/><ellipse cx="582" cy="303" rx="68" ry="32"/>
  </g>
  <g fill="#f2b56f" stroke="#a8602c" stroke-width="5">
    <ellipse cx="280" cy="303" rx="78" ry="32"/>
  </g>
  <g fill="#fff" stroke="#176d7b" stroke-width="4" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <circle cx="75" cy="108" r="24"/><circle cx="75" cy="206" r="24"/><circle cx="75" cy="303" r="24"/>
  </g>
  <g fill="#164b57" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <text x="75" y="116">1</text><text x="75" y="214">2</text><text x="75" y="311">3</text>
  </g>
</svg>
