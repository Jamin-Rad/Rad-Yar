  <text x="534" y="378" text-anchor="middle" fill="#885a32" font-family="Arial, sans-serif" font-size="14" font-weight="700">LISTER TUBERCLE</text>
  <rect x="272" y="577" width="656" height="52" rx="16" fill="#dce9e8"/>
  <text x="600" y="610" text-anchor="middle" fill="#345965" font-family="Arial, sans-serif" font-size="17" font-weight="700">Compartment map only · use the source MRI below for image orientation</text>
