  <title id="title">Non-diagnostic MRI signal schematic</title>
  <desc id="desc">Three simplified panels compare a dark fluid lesion on T1, a bright fluid lesion on T2 or STIR, and thin peripheral enhancement without central enhancement after contrast. These are explanatory shapes, not patient images.</desc>
