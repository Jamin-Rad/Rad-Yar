  <g stroke="#c5d5d8" stroke-width="2">
    <rect x="18" y="18" width="276" height="244" rx="16" fill="#fff"/>
    <rect x="312" y="18" width="276" height="244" rx="16" fill="#fff"/>
    <rect x="606" y="18" width="276" height="244" rx="16" fill="#fff"/>
  </g>
  <g fill="#9ba9ae">
    <ellipse cx="156" cy="140" rx="96" ry="78"/>
    <ellipse cx="450" cy="140" rx="96" ry="78"/>
    <ellipse cx="744" cy="140" rx="96" ry="78"/>
  </g>
  <g fill="#66777e" opacity=".75">
    <path d="M93 104c20-23 49-34 76-28 28 6 49 27 54 51 7 31-13 62-43 75-29 13-68 6-88-19-19-24-19-58 1-79Z"/>
