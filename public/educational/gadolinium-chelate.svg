<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="title desc">
  <title id="title">Gadolinium chelate concept schematic</title>
  <desc id="desc">A linear ligand loosely surrounds a gadolinium ion while a macrocyclic ligand forms a closed ring around a second gadolinium ion.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f766e" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="536" height="296" rx="28" fill="url(#panel)" stroke="#cbd5e1"/>
  <path d="M280 38v244" stroke="#cbd5e1" stroke-dasharray="5 8"/>
  <g filter="url(#shadow)">
    <circle cx="148" cy="158" r="52" fill="#0f766e"/>
