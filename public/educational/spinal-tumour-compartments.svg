  <title id="title">Axial spinal canal compartment schematic</title>
  <desc id="desc">Non-diagnostic axial concept diagram. The thick gray contour marks the bony canal, the blue contour marks the dural sac, and the purple oval marks the cord. Colored dots show intramedullary, intradural-extramedullary, and extradural locations.</desc>
