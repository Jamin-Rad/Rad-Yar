  <rect x="28" y="28" width="286" height="304" rx="22" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <rect x="326" y="28" width="286" height="304" rx="22" fill="#F0FDFA" stroke="#99F6E4" stroke-width="2"/>

  <!-- Pregnancy: maternal circulation, placenta, and fetus are symbolic, not anatomical. -->
  <circle cx="171" cy="122" r="68" fill="#FFEDD5"/>
