    <path d="M25 115 C95 38 150 192 220 115 S345 38 415 115" fill="none" stroke="#20a6bf" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 119 C144 95 165 140 189 116 S235 95 259 119" fill="none" stroke="#afd9e5" stroke-width="3" stroke-dasharray="7 8"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#67818b"/></marker></defs>
</svg>
