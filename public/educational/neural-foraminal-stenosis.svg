<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual lumbar neural foramen grading</title>
  <desc id="desc">Four simplified panels show preserved perineural fat, loss in one opposing direction, loss in both axes without root deformation, and a flattened nerve root. This is a teaching schematic, not an MRI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf4f5"/></linearGradient>
    <style>
      .panel{fill:url(#bg);stroke:#c8dadd;stroke-width:2}.bone{fill:#d8c9ac;stroke:#8d7b62;stroke-width:3}.root{fill:#edc88b;stroke:#946b36;stroke-width:3}.fat{fill:none;stroke:#73b7b2;stroke-width:18;stroke-linecap:round}.contact{fill:none;stroke:#c86f4b;stroke-width:15;stroke-linecap:round}.num{font:700 26px system-ui,sans-serif;fill:#244d52}
    </style>
  </defs>
  <rect width="960" height="380" rx="28" fill="#fff"/>
  <g transform="translate(20 20)">
    <g transform="translate(0 0)"><rect class="panel" width="220" height="330" rx="20"/><text class="num" x="110" y="48" text-anchor="middle">0</text><path class="bone" d="M42 113h136v54H42zM42 225h136v54H42z"/><ellipse class="fat" cx="110" cy="196" rx="48" ry="29"/><ellipse class="root" cx="110" cy="196" rx="22" ry="12"/></g>
    <g transform="translate(230 0)"><rect class="panel" width="220" height="330" rx="20"/><text class="num" x="110" y="48" text-anchor="middle">1</text><path class="bone" d="M42 113h136v54H42zM42 225h136v54H42z"/><path class="fat" d="M79 180a40 23 0 0 0 0 32M141 180a40 23 0 0 1 0 32"/><path class="contact" d="M110 164v14M110 214v14"/><ellipse class="root" cx="110" cy="196" rx="22" ry="12"/></g>
    <g transform="translate(460 0)"><rect class="panel" width="220" height="330" rx="20"/><text class="num" x="110" y="48" text-anchor="middle">2</text><path class="bone" d="M42 113h136v54H42zM42 225h136v54H42z"/><path class="contact" d="M110 164v14M110 214v14M56 196h22M142 196h22"/><ellipse class="root" cx="110" cy="196" rx="22" ry="12"/></g>
    <g transform="translate(690 0)"><rect class="panel" width="220" height="330" rx="20"/><text class="num" x="110" y="48" text-anchor="middle">3</text><path class="bone" d="M42 113h136v54H42zM42 225h136v54H42z"/><path class="contact" d="M110 164v14M110 214v14M56 196h22M142 196h22"/><ellipse class="root" cx="110" cy="196" rx="27" ry="7"/></g>
  </g>
</svg>
