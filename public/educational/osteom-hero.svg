<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="title desc">
  <title id="title">Osteoma schematic</title>
  <desc id="desc">A dense, smooth bony projection arising from the margin of a paranasal sinus.</desc>
  <defs>
    <linearGradient id="bone" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff5df"/><stop offset="1" stop-color="#d9b98d"/></linearGradient>
    <linearGradient id="sinus" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#16313a"/><stop offset="1" stop-color="#244956"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.4"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#09212a" flood-opacity=".35"/></filter>
  </defs>
  <rect x="12" y="12" width="536" height="406" rx="32" fill="#1b3d47"/>
