<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 390" role="img" aria-labelledby="title desc">
  <title id="title">Guillain–Barré MRI: interpretive boundaries</title>
  <desc id="desc">Non-diagnostic conceptual diagram. MRI is selected for atypical or uncertain presentations to assess nerve roots and look for mimics. Root enhancement is supportive but nonspecific; a normal study does not exclude Guillain–Barré syndrome.</desc>
