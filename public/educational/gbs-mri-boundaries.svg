  </defs>
  <rect x="8" y="8" width="1164" height="374" rx="30" fill="url(#bg)" stroke="#426b78" stroke-width="3"/>
  <g font-family="Arial, sans-serif" fill="#f4f7f7" text-anchor="middle">
