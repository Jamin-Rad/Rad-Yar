    <circle cx="790" cy="237" r="14" fill="#277f83"/><text x="790" y="243" fill="white">2</text>
    <circle cx="115" cy="311" r="14" fill="#b54d60"/><text x="115" y="317" fill="white">3</text>
    <circle cx="550" cy="319" r="14" fill="#b54d60"/><text x="550" y="325" fill="white">3</text>
