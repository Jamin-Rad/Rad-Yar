<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Thumb ulnar collateral ligament and Stener lesion schematic</title>
  <desc id="desc">The left panel shows an intact ulnar collateral ligament beneath the adductor aponeurosis. The right panel shows a proximally retracted ligament stump superficial to the aponeurosis, which is interposed between the stump and its insertion.</desc>
  <defs>
    <linearGradient id="bone" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff2d2"/><stop offset="1" stop-color="#d6b884"/></linearGradient>
    <linearGradient id="tissue" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ef8994"/><stop offset="1" stop-color="#bd5265"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#4e7783"/></marker>
  </defs>
  <rect x="14" y="14" width="872" height="492" rx="28" fill="#edf5f6"/>
  <path d="M450 64v392" stroke="#c4d5d8" stroke-width="2" stroke-dasharray="7 10"/>
  <g stroke="#886e4f" stroke-width="4" stroke-linejoin="round">
    <path d="M126 95q62-35 117 0l27 145q4 29-18 46l-22 24q-18 20-4 46l22 60q10 24-15 35l-13 5q-19 7-30-11l-46-71q-20-31-15-65l11-74-26-102q-5-22 12-38z" fill="url(#bone)"/>
    <path d="M286 271q29-18 56 0l10 39q5 20-10 32l-18 15 1 51q1 19-19 23l-10 2q-18 3-23-15l-8-43q-4-19 8-33l15-17-11-36q-4-13 9-18z" fill="url(#bone)"/>
    <path d="M569 95q62-35 117 0l27 145q4 29-18 46l-22 24q-18 20-4 46l22 60q10 24-15 35l-13 5q-19 7-30-11l-46-71q-20-31-15-65l11-74-26-102q-5-22 12-38z" fill="url(#bone)"/>
    <path d="M729 271q29-18 56 0l10 39q5 20-10 32l-18 15 1 51q1 19-19 23l-10 2q-18 3-23-15l-8-43q-4-19 8-33l15-17-11-36q-4-13 9-18z" fill="url(#bone)"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M278 273q31 18 61 5" stroke="#277f83" stroke-width="16"/>
    <path d="M681 283q30 8 53-9" stroke="url(#tissue)" stroke-width="21"/>
