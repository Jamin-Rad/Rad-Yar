  <path d="M708 266q-18-24-34-32" fill="none" stroke="#277f83" stroke-width="14" stroke-linecap="round"/>
  <g fill="#244753" font-family="Arial,sans-serif" text-anchor="middle" font-size="23" font-weight="700">
    <text x="225" y="74">A</text>
    <text x="675" y="74">B</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">
