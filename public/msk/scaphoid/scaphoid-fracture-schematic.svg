<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Scaphoid fracture and SNAC progression schematic</title>
  <desc id="desc">A stylized scaphoid with a waist fracture beside a three-step diagram from nonunion to progressive wrist arthritis.</desc>
  <defs>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2d6a8"/><stop offset="1" stop-color="#b98b54"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf8f6"/><stop offset="1" stop-color="#d4ece8"/></linearGradient>
  </defs>
  <rect x="20" y="20" width="680" height="460" rx="40" fill="#122630"/>
  <circle cx="204" cy="246" r="139" fill="#1c3943" stroke="#456a73" stroke-width="2"/>
  <path d="M108 268c8-54 33-99 73-116 21-9 36 5 42 24 5 15 3 35 14 45 11 10 32 4 50 10 21 7 31 27 19 46-24 39-74 80-126 87-37 5-77-26-72-96Z" fill="url(#bone)" stroke="#f4dfbd" stroke-width="5"/>
  <path d="m224 185-13 30 19 15-14 31" stroke="#9b4e4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m216 222 17 8" stroke="#fff0db" stroke-width="4" stroke-linecap="round"/>
  <text x="204" y="421" fill="#d9eeec" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Scaphoid waist</text>
  <path d="M366 249h36" stroke="#78c7bd" stroke-width="4" stroke-linecap="round"/>
  <path d="m394 238 12 11-12 11" stroke="#78c7bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="420" y="98" width="236" height="304" rx="28" fill="url(#panel)"/>
  <text x="538" y="135" fill="#176c68" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Nonunion → SNAC</text>
  <g fill="#d5b27f" stroke="#8a6743" stroke-width="2">
    <path d="M468 176c12-19 37-24 51-11 14 13 7 34-5 46-11 12-34 12-46 1-10-9-8-24 0-36Z"/>
    <path d="M532 172c13-13 36-10 43 7 6 15-4 30-18 39-13 8-31 3-36-11-4-12 2-26 11-35Z"/>
    <path d="M582 177c11-14 33-10 39 5 6 14-3 27-17 34-13 7-29 2-33-11-3-10 3-21 11-28Z"/>
  </g>
  <path d="M466 223 518 218" stroke="#ae514f" stroke-width="5" stroke-linecap="round"/>
  <path d="M544 225 593 213M558 235 607 223" stroke="#ae514f" stroke-width="4" stroke-linecap="round"/>
  <text x="493" y="270" fill="#27434b" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">nonunion</text>
  <text x="566" y="270" fill="#27434b" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">arthritis</text>
  <text x="538" y="319" fill="#176c68" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Conceptual progression;</text>
  <text x="538" y="340" fill="#176c68" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">not a diagnostic image</text>
</svg>
