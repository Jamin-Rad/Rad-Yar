    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fbfc"/><stop offset=".5" stop-color="#91a8b2"/><stop offset="1" stop-color="#d9e6e8"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.4"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#12252d" flood-opacity=".16"/></filter>
  </defs>
  <rect width="720" height="360" rx="28" fill="#f3f7f5"/>
