  <title id="title">Vancouver classification regions</title>
  <desc id="desc">Schematic femur with hip prosthesis. AG marks the greater trochanter on the lateral proximal projection; AL marks the lesser trochanter at the medial neck-shaft junction. B is around the stem and C is below its tip.</desc>
