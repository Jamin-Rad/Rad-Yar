<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Entscheidungsweg bei Thoraxschmerz und Troponinanstieg</title>
  <desc id="desc">ST-Hebung, hämodynamische Instabilität, ein sehr hoher Troponin-Ausgangswert oder eine signifikante Troponin-Dynamik führen zur Koronarangiographie. Nach Ausschluss einer obstruktiven KHK oder bei stabilem Patienten mit weiter unklarer Ursache hilft die Kardio-MRT bei der Gewebediagnose.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b2c"/>
      <stop offset="0.55" stop-color="#0c1728"/>
      <stop offset="1" stop-color="#071d3a"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7255b"/>
      <stop offset="1" stop-color="#561743"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#329aaa"/>
      <stop offset="1" stop-color="#176878"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrowPink" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l10 5.5L1 12z" fill="#ef4f7d"/>
    </marker>
    <marker id="arrowTeal" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l10 5.5L1 12z" fill="#45bfd0"/>
    </marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.display{font-family:Inter,Arial,sans-serif;font-weight:800}.label{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:800;letter-spacing:2px}.muted{fill:#a9b7ca}.white{fill:#f8fafc}.pink{fill:#ff8cab}.cyan{fill:#75d9e4}.box{fill:#172236;stroke:#34435a;stroke-width:2}.q{fill:#f8fafc;font-size:25px;font-weight:800}.body{fill:#cbd5e1;font-size:20px}.mini{fill:#a9b7ca;font-size:17px}.yesLine{fill:none;stroke:#ef4f7d;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.noLine{fill:none;stroke:#45bfd0;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:5}
    </style>
  </defs>

  <rect width="1200" height="1500" rx="30" fill="url(#bg)"/>
  <circle cx="1110" cy="130" r="260" fill="#329aaa" opacity="0.055"/>
  <circle cx="40" cy="1430" r="310" fill="#e73368" opacity="0.05"/>

  <text x="600" y="64" text-anchor="middle" class="display white" font-size="30">Der gesamte Weg auf einen Blick</text>
  <text x="600" y="92" text-anchor="middle" class="sans muted" font-size="17">Akutversorgung zuerst · CMR nach Ausschluss einer relevanten Koronarobstruktion</text>

  <g filter="url(#shadow)">
    <rect x="250" y="126" width="700" height="118" rx="24" fill="url(#magenta)" stroke="#ef4f7d" stroke-width="2"/>
    <text x="600" y="175" text-anchor="middle" class="display white" font-size="31">Thoraxschmerz + Troponin erhöht</text>
    <text x="600" y="211" text-anchor="middle" class="sans" fill="#ffdce6" font-size="19" font-weight="700">ECG · Klinik · hs-Troponin</text>
  </g>

  <path d="M600 244V292H845V320" class="yesLine thin" marker-end="url(#arrowPink)"/>

  <g filter="url(#shadow)">
    <rect x="610" y="323" width="520" height="122" rx="20" class="box"/>
    <circle cx="660" cy="384" r="27" fill="#e73368"/>
    <text x="660" y="392" text-anchor="middle" class="display white" font-size="17">01</text>
    <text x="705" y="375" class="sans q">ST-Hebung oder</text>
    <text x="705" y="407" class="sans q">hämodynamisch instabil?</text>
  </g>

  <path d="M610 384H526" class="yesLine"/>
  <text x="552" y="366" class="sans pink" font-size="17" font-weight="900" letter-spacing="2">JA</text>
  <path d="M526 384V890" class="yesLine"/>

  <path d="M870 445V506" class="noLine" marker-end="url(#arrowTeal)"/>
  <text x="895" y="480" class="sans cyan" font-size="17" font-weight="900" letter-spacing="2">NEIN</text>

  <g filter="url(#shadow)">
    <rect x="610" y="510" width="520" height="122" rx="20" class="box"/>
    <circle cx="660" cy="571" r="27" fill="#e73368"/>
    <text x="660" y="579" text-anchor="middle" class="display white" font-size="17">02</text>
    <text x="705" y="562" class="sans q">Sehr hoher hs-Troponin-</text>
    <text x="705" y="594" class="sans q">Ausgangswert?</text>
  </g>

  <path d="M610 571H526" class="yesLine"/>
  <text x="552" y="553" class="sans pink" font-size="17" font-weight="900" letter-spacing="2">JA</text>

  <path d="M870 632V680" class="noLine" marker-end="url(#arrowTeal)"/>
  <text x="895" y="661" class="sans cyan" font-size="17" font-weight="900" letter-spacing="2">NEIN</text>

  <g>
    <rect x="665" y="686" width="410" height="94" rx="17" fill="#102c3b" stroke="#329aaa" stroke-width="2"/>
    <rect x="687" y="708" width="72" height="48" rx="14" fill="url(#teal)"/>
    <text x="723" y="739" text-anchor="middle" class="display white" font-size="19">0/1 h</text>
    <text x="783" y="723" class="sans white" font-size="20" font-weight="800">hs-Troponin nach 1 Stunde</text>
    <text x="783" y="750" class="sans white" font-size="20" font-weight="800">wiederholen</text>
  </g>

  <path d="M870 780V831" class="noLine" marker-end="url(#arrowTeal)"/>

  <g filter="url(#shadow)">
    <rect x="610" y="835" width="520" height="122" rx="20" class="box"/>
    <circle cx="660" cy="896" r="27" fill="#e73368"/>
    <text x="660" y="904" text-anchor="middle" class="display white" font-size="17">03</text>
    <text x="705" y="887" class="sans q">Signifikante hs-Troponin-</text>
    <text x="705" y="919" class="sans q">Dynamik?</text>
  </g>

  <path d="M610 896H526" class="yesLine"/>
  <text x="552" y="878" class="sans pink" font-size="17" font-weight="900" letter-spacing="2">JA</text>

  <g filter="url(#shadow)">
    <rect x="70" y="515" width="390" height="260" rx="25" fill="url(#magenta)" stroke="#ef4f7d" stroke-width="2"/>
    <text x="265" y="573" text-anchor="middle" class="label" fill="#ffc4d3">JA / RULE-IN</text>
    <text x="265" y="628" text-anchor="middle" class="display white" font-size="31">Koronarangiographie</text>
    <line x1="112" y1="654" x2="418" y2="654" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="265" y="694" text-anchor="middle" class="sans" fill="#fce7ef" font-size="19">Bei ST-Hebung oder Instabilität sofort;</text>
    <text x="265" y="724" text-anchor="middle" class="sans" fill="#fce7ef" font-size="19">sonst invasive Abklärung nach Gesamtrisiko.</text>
  </g>
  <path d="M526 645H463" class="yesLine" marker-end="url(#arrowPink)"/>

  <path d="M265 775V1002" class="noLine" marker-end="url(#arrowTeal)"/>
  <path d="M870 957V1002" class="noLine" marker-end="url(#arrowTeal)"/>
  <text x="895" y="988" class="sans cyan" font-size="17" font-weight="900" letter-spacing="2">NEIN</text>

  <g>
    <rect x="65" y="1010" width="465" height="136" rx="20" fill="#102c3b" stroke="#329aaa" stroke-width="2"/>
    <text x="297.5" y="1055" text-anchor="middle" class="sans cyan" font-size="17" font-weight="900">NACH ANGIOGRAPHIE</text>
    <text x="297.5" y="1090" text-anchor="middle" class="sans white" font-size="21" font-weight="800">Keine obstruktive KHK /</text>
    <text x="297.5" y="1120" text-anchor="middle" class="sans white" font-size="21" font-weight="800">keine Culprit-Läsion</text>
  </g>

  <g>
    <rect x="670" y="1010" width="465" height="136" rx="20" fill="#102c3b" stroke="#329aaa" stroke-width="2"/>
    <text x="902.5" y="1067" text-anchor="middle" class="sans cyan" font-size="17" font-weight="900">KLINISCH STABIL</text>
    <text x="902.5" y="1105" text-anchor="middle" class="sans white" font-size="22" font-weight="800">Stabil und Ursache weiterhin unklar</text>
  </g>

  <path d="M297 1146V1221H535" class="noLine" marker-end="url(#arrowTeal)"/>
  <path d="M903 1146V1221H665" class="noLine" marker-end="url(#arrowTeal)"/>

  <g filter="url(#shadow)">
    <rect x="220" y="1232" width="760" height="190" rx="28" fill="url(#teal)" stroke="#75d9e4" stroke-width="2"/>
    <text x="600" y="1281" text-anchor="middle" class="label" fill="#baf5fa">GEWEBEDIAGNOSE</text>
    <text x="600" y="1342" text-anchor="middle" class="display white" font-size="50">CMR</text>
    <text x="600" y="1384" text-anchor="middle" class="sans white" font-size="22" font-weight="700">Infarkt · Myokarditis · Takotsubo</text>
    <text x="600" y="1414" text-anchor="middle" class="sans" fill="#d9fbfe" font-size="19">oder andere Myokardschädigung differenzieren</text>
  </g>
</svg>
