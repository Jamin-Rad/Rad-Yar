<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title desc">
  <title id="title">Entscheidungsweg bei Thoraxschmerz und erhöhtem Troponin</title>
  <desc id="desc">Bei ST-Hebung, hämodynamischer Instabilität, sehr hohem Troponin-Ausgangswert oder signifikanter Troponin-Dynamik führt der Weg ins Herzkatheterlabor. Bei fehlender obstruktiver KHK oder bei klinischer Stabilität mit weiterhin unklarer Ursache folgt die CMR zur Differenzierung der Myokardschädigung.</desc>
  <defs>
    <linearGradient id="start" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#82224f"/><stop offset="1" stop-color="#561743"/></linearGradient>
    <linearGradient id="cmr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#147785"/><stop offset="1" stop-color="#07505f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#3b1931" flood-opacity="0.12"/></filter>
    <marker id="arrowPink" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1l13 6.5L1 14z" fill="#bd2c62"/></marker>
    <marker id="arrowTeal" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1l13 6.5L1 14z" fill="#218b9a"/></marker>
    <style>.font{font-family:Inter,Arial,sans-serif}.title{font-family:Inter,Arial,sans-serif;font-weight:800}.question{fill:#201624;font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:780}.small{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:800;letter-spacing:1.7px}.yes{fill:none;stroke:#bd2c62;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.no{fill:none;stroke:#218b9a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.node{fill:#fff;stroke:#dfd5dc;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="1300" rx="28" fill="#fff"/>
  <path d="M0 0h1200v210C965 150 870 188 682 188 455 188 303 126 0 211z" fill="#f7f1f5"/>
  <circle cx="1130" cy="50" r="170" fill="#218b9a" opacity="0.055"/><circle cx="62" cy="1240" r="210" fill="#bd2c62" opacity="0.045"/>

  <g filter="url(#shadow)"><rect x="470" y="58" width="660" height="116" rx="23" fill="url(#start)"/><text x="800" y="108" text-anchor="middle" class="title" fill="#fff" font-size="31">Thoraxschmerz + Troponin erhöht</text><text x="800" y="142" text-anchor="middle" class="font" fill="#f9d9e6" font-size="18" font-weight="700">EKG · Klinik · hs-Troponin</text></g>
  <path d="M800 174V224" class="no" marker-end="url(#arrowTeal)"/>

  <g filter="url(#shadow)"><rect x="470" y="232" width="660" height="112" rx="18" class="node"/><circle cx="526" cy="288" r="26" fill="#bd2c62"/><text x="526" y="296" text-anchor="middle" class="title" fill="#fff" font-size="16">01</text><text x="570" y="280" class="question">ST-Hebung oder</text><text x="570" y="312" class="question">hämodynamisch instabil?</text></g>
  <path d="M470 288H412V760" class="yes"/><text x="428" y="270" class="small" fill="#bd2c62">JA</text>
  <path d="M800 344V398" class="no" marker-end="url(#arrowTeal)"/><text x="823" y="379" class="small" fill="#218b9a">NEIN</text>

  <g filter="url(#shadow)"><rect x="470" y="406" width="660" height="112" rx="18" class="node"/><circle cx="526" cy="462" r="26" fill="#bd2c62"/><text x="526" y="470" text-anchor="middle" class="title" fill="#fff" font-size="16">02</text><text x="570" y="454" class="question">Sehr hoher hs-Troponin-</text><text x="570" y="486" class="question">Ausgangswert?</text></g>
  <path d="M470 462H412" class="yes"/><text x="428" y="444" class="small" fill="#bd2c62">JA</text>

  <g filter="url(#shadow)"><rect x="45" y="413" width="340" height="98" rx="20" fill="#f8eaf0" stroke="#bd2c62" stroke-width="2.5"/><text x="215" y="471" text-anchor="middle" class="title" fill="#561743" font-size="24">Herzkatheterlabor</text></g>
  <path d="M412 462H389" class="yes" marker-end="url(#arrowPink)"/>

  <path d="M800 518V560" class="no" marker-end="url(#arrowTeal)"/><text x="823" y="548" class="small" fill="#218b9a">NEIN</text>
  <g><rect x="538" y="568" width="524" height="68" rx="16" fill="#eef8f9" stroke="#218b9a" stroke-width="2"/><path d="M574 588v15h15m-15 0a20 20 0 1 0 7-15" fill="none" stroke="#218b9a" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="614" y="611" class="title" fill="#164e56" font-size="22">hs-Troponin nach 1 Stunde wiederholen</text></g>
  <path d="M800 636V682" class="no" marker-end="url(#arrowTeal)"/>

  <g filter="url(#shadow)"><rect x="470" y="690" width="660" height="112" rx="18" class="node"/><circle cx="526" cy="746" r="26" fill="#bd2c62"/><text x="526" y="754" text-anchor="middle" class="title" fill="#fff" font-size="16">03</text><text x="570" y="754" class="question">Signifikante hs-Troponin-Dynamik?</text></g>
  <path d="M470 746H412" class="yes"/><text x="428" y="728" class="small" fill="#bd2c62">JA</text>
  <path d="M800 802V868" class="no" marker-end="url(#arrowTeal)"/><text x="823" y="841" class="small" fill="#218b9a">NEIN</text><path d="M210 511V868" class="no" marker-end="url(#arrowTeal)"/>

  <g><rect x="60" y="878" width="390" height="104" rx="18" fill="#eef8f9" stroke="#8cc7cf" stroke-width="2"/><text x="255" y="940" text-anchor="middle" class="title" fill="#164e56" font-size="23">Keine obstruktive KHK</text></g>
  <g><rect x="650" y="878" width="480" height="104" rx="18" fill="#eef8f9" stroke="#8cc7cf" stroke-width="2"/><text x="890" y="923" text-anchor="middle" class="title" fill="#164e56" font-size="23">Klinisch stabil und Ursache</text><text x="890" y="954" text-anchor="middle" class="title" fill="#164e56" font-size="23">weiterhin unklar</text></g>
  <path d="M255 982V1032H600" class="no"/><path d="M890 982V1032H600" class="no"/><path d="M600 1032V1070" class="no" marker-end="url(#arrowTeal)"/>

  <g filter="url(#shadow)"><rect x="250" y="1080" width="700" height="166" rx="25" fill="url(#cmr)"/><text x="600" y="1144" text-anchor="middle" class="title" fill="#fff" font-size="43">CMR</text><text x="600" y="1186" text-anchor="middle" class="font" fill="#e0f7f9" font-size="21" font-weight="700">Infarkt · Myokarditis · Takotsubo</text><text x="600" y="1218" text-anchor="middle" class="font" fill="#c8edf1" font-size="19">oder andere Myokardschädigung differenzieren</text></g>
</svg>
