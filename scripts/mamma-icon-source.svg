<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#132d49"/>
      <stop offset="0.55" stop-color="#0b1f38"/>
      <stop offset="1" stop-color="#050d1c"/>
    </linearGradient>
    <linearGradient id="breastStroke" x1="120" y1="90" x2="380" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#8fd6ff"/>
      <stop offset="1" stop-color="#e73368"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(258 280) scale(95)">
      <stop stop-color="#ffd9e3" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#e73368" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e73368" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotBlur" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>

  <g stroke="rgba(255,255,255,0.055)" stroke-width="2.2" fill="none">
    <path d="M-20 108 C 90 78, 170 148, 300 108 S 480 78, 560 118"/>
    <path d="M-20 200 C 110 170, 190 240, 310 200 S 470 170, 560 210"/>
    <path d="M-20 400 C 110 370, 210 430, 330 392 S 480 362, 560 410"/>
    <path d="M-20 460 C 120 434, 220 476, 340 448 S 490 424, 560 458"/>
  </g>

  <circle cx="258" cy="280" r="100" fill="url(#dotGlow)"/>

  <path
    d="M158 132 L158 396"
    fill="none" stroke="url(#breastStroke)" stroke-width="15" stroke-linecap="round" opacity="0.55"/>

  <path
    d="M158 132 C 158 96, 200 78, 240 84 C 312 94, 378 148, 388 234 C 397 310, 366 378, 306 404 C 258 425, 202 415, 172 380"
    fill="none" stroke="url(#breastStroke)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>

  <g filter="url(#dotBlur)">
    <circle cx="222" cy="222" r="8" fill="#ffffff"/>
    <circle cx="252" cy="238" r="10" fill="#ffe3ea"/>
    <circle cx="238" cy="268" r="7" fill="#ff9d4d"/>
    <circle cx="270" cy="278" r="10" fill="#e73368"/>
    <circle cx="298" cy="258" r="6" fill="#8fd6ff"/>
    <circle cx="252" cy="308" r="7" fill="#ffffff"/>
    <circle cx="284" cy="316" r="9" fill="#e73368"/>
    <circle cx="308" cy="300" r="5.5" fill="#ff9d4d"/>
  </g>
</svg>
